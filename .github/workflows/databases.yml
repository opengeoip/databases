name: Databases

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: databases
  cancel-in-progress: false

env:
  KEEP_RELEASES: "30"

jobs:
  publish:
    name: Publish
    if: github.repository_owner == 'opengeoip'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download geoip-builder
        run: |
          mkdir -p tool
          cd tool
          gh release download --repo opengeoip/geoip-builder --pattern "geoip-builder-*-x86_64-unknown-linux-musl.tar.gz" --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify geoip-builder-*-x86_64-unknown-linux-musl.tar.gz --repo opengeoip/geoip-builder
          tar -xzf geoip-builder-*-x86_64-unknown-linux-musl.tar.gz --strip-components=1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Fetch
        run: tool/geoip-builder fetch || tool/geoip-builder fetch
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Build
        run: tool/geoip-builder build
      - name: Check
        run: |
          for db in country city asn; do
            size=$(stat -c %s "out/${db}.mmdb")
            if [ "${size}" -lt 5000000 ]; then echo "out/${db}.mmdb is only ${size} bytes"; exit 1; fi
          done
          tool/geoip-builder lookup out/country.mmdb 1.1.1.1 | grep -q '"iso_code":"AU"'
          tool/geoip-builder lookup out/city.mmdb 1.1.1.1 | grep -q '"iso_code":"AU"'
          tool/geoip-builder lookup out/asn.mmdb 8.8.8.8 | grep -q '"autonomous_system_number":15169'
      - name: Prepare the release
        run: |
          mkdir -p dist
          for db in country city asn; do cp "out/${db}.mmdb" "dist/opengeoip-${db}.mmdb"; done
          (cd dist && sha256sum ./*.mmdb > SHA256SUMS)
          tool/geoip-builder evaluate --top 0 out/country.mmdb > evaluate.txt
          accuracy() { awk -v family="$1:" '$1 == family {found=1; next} found && /correct/ {print $4; exit}' evaluate.txt; }
          version=$(tool/geoip-builder --version | cut -d' ' -f2)
          {
            echo "Built with geoip-builder ${version} and geofeed catalog $(gh release view --repo opengeoip/geofeeds --json tagName --jq .tagName)."
            echo
            echo "Country right for $(accuracy IPv4) % of IPv4 and $(accuracy IPv6) % of IPv6 RIPE Atlas probes."
          } > dist/notes.md
          cat dist/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mmdb
      - name: Release
        run: |
          tag=$(date -u +%Y.%-m.%-d)
          assets=(dist/opengeoip-country.mmdb dist/opengeoip-city.mmdb dist/opengeoip-asn.mmdb dist/SHA256SUMS)
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file dist/notes.md --latest
          else
            gh release create "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --title "${tag}" --notes-file dist/notes.md --latest
          fi
      - name: Prune old releases
        run: |
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[env.KEEP_RELEASES | tonumber:] | .[].tagName' |
            while read -r tag; do
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done
