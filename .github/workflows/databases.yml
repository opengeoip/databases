name: Databases

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the comparison with the previous release fails
        type: boolean
        default: false

permissions: {}

concurrency:
  group: databases
  cancel-in-progress: false

env:
  KEEP_RELEASES: "30"
  MAX_SIZE_CHANGE: "10"
  MAX_ACCURACY_DROP: "1"

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    if: github.repository_owner == 'opengeoip'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: tag
        run: |
          echo "tag=$(date -u +%Y.%-m.%-d)" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download geoip-builder
        run: |
          mkdir -p tool
          cd tool
          gh release download --repo opengeoip/geoip-builder --pattern "geoip-builder-*-x86_64-unknown-linux-musl.tar.gz" --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify geoip-builder-*-x86_64-unknown-linux-musl.tar.gz --repo opengeoip/geoip-builder
          tar -xzf geoip-builder-*-x86_64-unknown-linux-musl.tar.gz --strip-components=1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Fetch
        run: tool/geoip-builder fetch || tool/geoip-builder fetch
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Build
        run: tool/geoip-builder build
      - name: Check
        run: |
          for db in country city asn; do
            size=$(stat -c %s "out/${db}.mmdb")
            if [ "${size}" -lt 5000000 ]; then echo "out/${db}.mmdb is only ${size} bytes"; exit 1; fi
          done
      - id: evaluate
        name: Evaluate
        run: |
          tool/geoip-builder evaluate --top 0 --json evaluation.json out/country.mmdb
          accuracy() { jq -r --arg family "$1" '.results[] | select(.family == $family and .by == null and .group == "all") | .databases[0].accuracy' evaluation.json; }
          ipv4=$(accuracy IPv4)
          ipv6=$(accuracy IPv6)
          if [ -z "${ipv4}" ] || [ -z "${ipv6}" ]; then echo "No accuracy in the evaluation"; exit 1; fi
          echo "ipv4=${ipv4}" >> "${GITHUB_OUTPUT}"
          echo "ipv6=${ipv6}" >> "${GITHUB_OUTPUT}"
      - name: Compare with the previous release
        env:
          FORCE: ${{ inputs.force || false }}
          TAG: ${{ steps.tag.outputs.tag }}
          DATE: ${{ steps.tag.outputs.date }}
          IPV4: ${{ steps.evaluate.outputs.ipv4 }}
          IPV6: ${{ steps.evaluate.outputs.ipv6 }}
        run: |
          failures=()
          previous=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 10 --json tagName,createdAt --jq '[sort_by(.createdAt) | reverse | .[] | select(.tagName != env.TAG)][0].tagName // empty')
          if [ -n "${previous}" ]; then
            gh release download "${previous}" --repo "${GITHUB_REPOSITORY}" --dir previous --pattern 'opengeoip-*.mmdb'
            for db in country city asn; do
              old=$(stat -c %s "previous/opengeoip-${db}.mmdb")
              new=$(stat -c %s "out/${db}.mmdb")
              change=$(awk -v o="${old}" -v n="${new}" 'BEGIN {printf "%.1f", (n - o) * 100 / o}')
              echo "${db}.mmdb: ${old} bytes in ${previous}, ${new} now (${change} %)"
              if awk -v c="${change}" -v m="${MAX_SIZE_CHANGE}" 'BEGIN {exit !(c > m || c < -m)}'; then
                failures+=("${db}.mmdb changed size by ${change} % since ${previous}")
              fi
            done
          fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          status=0
          git ls-remote --exit-code --heads "${remote}" accuracy > /dev/null || status=$?
          if [ "${status}" -eq 0 ]; then
            git fetch --quiet --depth 1 "${remote}" accuracy
            git show FETCH_HEAD:accuracy.csv > history.csv
          elif [ "${status}" -ne 2 ]; then
            exit "${status}"
          else
            echo "date,geoip_builder,ipv4,ipv6" > history.csv
          fi
          last=$(grep -v -e "^date," -e "^${DATE}," history.csv | tail -n 1 || true)
          if [ -n "${last}" ]; then
            IFS=, read -r last_date _ old4 old6 <<< "${last}"
            for family in 4 6; do
              old=$([ "${family}" = 4 ] && echo "${old4}" || echo "${old6}")
              new=$([ "${family}" = 4 ] && echo "${IPV4}" || echo "${IPV6}")
              echo "IPv${family} accuracy: ${old} % on ${last_date}, ${new} % now"
              if awk -v o="${old}" -v n="${new}" -v l="${MAX_ACCURACY_DROP}" 'BEGIN {exit !(o - n > l)}'; then
                failures+=("IPv${family} accuracy dropped from ${old} % on ${last_date} to ${new} %")
              fi
            done
          fi
          if [ "${#failures[@]}" -gt 0 ]; then
            printf '%s\n' "${failures[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
            if [ "${FORCE}" != true ]; then exit 1; fi
            echo "Published anyway" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Prepare the release
        env:
          DATE: ${{ steps.tag.outputs.date }}
          IPV4: ${{ steps.evaluate.outputs.ipv4 }}
          IPV6: ${{ steps.evaluate.outputs.ipv6 }}
        run: |
          mkdir -p dist
          for db in country city asn; do cp "out/${db}.mmdb" "dist/opengeoip-${db}.mmdb"; done
          (cd dist && sha256sum ./*.mmdb > SHA256SUMS)
          version=$(tool/geoip-builder --version | cut -d' ' -f2)
          mkdir -p accuracy
          grep -v "^${DATE}," history.csv > accuracy/accuracy.csv
          echo "${DATE},${version},${IPV4},${IPV6}" >> accuracy/accuracy.csv
          python3 scripts/accuracy-chart.py accuracy/accuracy.csv accuracy/accuracy.svg
          cp evaluation.json dist/evaluation.json
          python3 scripts/accuracy-tables.py evaluation.json > tables.md
          {
            echo "Built with geoip-builder ${version} and geofeed catalog $(gh release view --repo opengeoip/geofeeds --json tagName --jq .tagName)."
            echo
            echo "Country right for ${IPV4} % of IPv4 and ${IPV6} % of IPv6 RIPE Atlas probes, with the number of probe addresses in brackets:"
            echo
            cat tables.md
          } > dist/notes.md
          {
            echo "# Accuracy on ${DATE}"
            echo
            echo "Country right for ${IPV4} % of IPv4 and ${IPV6} % of IPv6 RIPE Atlas probes, with the number of probe addresses in brackets:"
            echo
            cat tables.md
          } > accuracy/README.md
          cat dist/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mmdb
      - name: Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="${TAG}"
          assets=(dist/opengeoip-country.mmdb dist/opengeoip-city.mmdb dist/opengeoip-asn.mmdb dist/SHA256SUMS dist/evaluation.json)
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file dist/notes.md --latest
          else
            gh release create "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --title "${tag}" --notes-file dist/notes.md --latest
          fi
      - name: Publish the accuracy history
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd accuracy
          git init --quiet --initial-branch accuracy
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git fetch --quiet --depth 1 "${remote}" accuracy; then
            git reset --quiet --soft FETCH_HEAD
          fi
          git add accuracy.csv accuracy.svg README.md
          if git diff --cached --quiet && git rev-parse --verify --quiet HEAD > /dev/null; then
            exit 0
          fi
          git commit --quiet --message "chore: accuracy of ${TAG}"
          git push --quiet "${remote}" HEAD:accuracy
      - name: Prune old releases
        run: |
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[env.KEEP_RELEASES | tonumber:] | .[].tagName' |
            while read -r tag; do
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done

  image:
    name: Image (${{ matrix.database }})
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        database:
          - country
          - city
          - asn
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE: ${{ matrix.database }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.database }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the database
        run: |
          mkdir -p image
          cd image
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "opengeoip-${DATABASE}.mmdb" --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          rm SHA256SUMS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=opengeoip-${{ matrix.database }}.mmdb
            org.opencontainers.image.description=opengeoip ${{ matrix.database }} database in MaxMind DB format, at /opengeoip-${{ matrix.database }}.mmdb
            org.opencontainers.image.licenses=NOASSERTION
          annotations: |
            org.opencontainers.image.title=opengeoip-${{ matrix.database }}.mmdb
            org.opencontainers.image.description=opengeoip ${{ matrix.database }} database in MaxMind DB format, at /opengeoip-${{ matrix.database }}.mmdb
            org.opencontainers.image.licenses=NOASSERTION
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: Containerfile
          build-args: DATABASE=${{ matrix.database }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: databases/${{ matrix.database }}
          keep-n-tagged: ${{ env.KEEP_RELEASES }}
          delete-untagged: true
